# ============================================================================
# dsh-video-prompt — DSH bundle patch
# ============================================================================
# 宿主行：随 bundle 层栈插入 Web profile。宿主半边负责
#   ① /dvp/* HTTP 路由（媒体目录扫描、单文件读取、状态回写、图片预览）
#   ② 把本包 skills/ 下的技能包注册进 ctx.skills 全局层
#      （video-prompt-pipeline / watch / oneshot-prompt-generator /
#        prompt-videos / video-generation）
# 客户端半边是 /plugins/dsh-video-prompt/client.js，注册对话框旁的模式按钮。
#
# 安装（DSH 关闭时在终端执行，或在 DSH 里让助手执行）：
#   dsh plugin --profile web add link:<本机放本包的目录>/dsh-video-prompt
# 装完重启一次桌面端（宿主行 + 新客户端 bundle 需要重新扫描）。
# 之后：技能立即出现在技能目录；面板改配置只需刷新页面，不用再重启。
#
# 媒体/产物目录（每台机器不一样，所以本包**不预设任何绝对路径**）：
#   ① 默认：$DSH_HOME/dsh-video-prompt/media 与 .../runs（面板首次打开就在这里）；
#   ② 面板里改成自己的素材盘，会写进 $DSH_HOME/dsh-video-prompt/state.json；
#   ③ 想在 profile 层固定下来（多人/多机各一份），在自己的
#      $DSH_HOME/profiles/web/cordis.patch.yml 里按 id 覆盖，例如：
#        - id: video-prompt
#          config:
#            mediaRoot: 'E:/我的素材'
#            runsRoot: 'E:/我的产物'
#            registerSkills: true
#      （config 是整块替换：覆盖时把 registerSkills 一起写上。）
#   路径支持 ~、$DSH_HOME、%DSH_HOME%。
# ============================================================================

- insert:
    - id: video-prompt
      name: dsh-video-prompt
      config:
        # 是否把本包 skills/ 注册进全局技能目录。
        registerSkills: true
